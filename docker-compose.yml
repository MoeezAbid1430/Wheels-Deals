services:
  postgres:
    image: postgres:16-alpine
    container_name: wheels-deals-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wheels_deals
      POSTGRES_USER: wheels_deals
      POSTGRES_PASSWORD: wheels_deals_dev_password
    ports:
      - "5432:5432"
    volumes:
      - wheels_deals_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheels_deals -d wheels_deals"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: wheels-deals-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: wheels_deals_dev_search_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - wheels_deals_meili:/meili_data

volumes:
  wheels_deals_postgres:
  wheels_deals_meili:
